[pytest]
markers =
    fast
    slow
    bug_regression: marks tests that verify pre-refactor bugs are fixed
    r2: marks Round 2 regression tests
    r3: marks Round 3 regression tests
    r4: marks Round 4 regression tests

# Global timeout: fail any test that takes longer than 180 seconds
# This prevents CI from hanging indefinitely on stuck tests
timeout = 180
timeout_method = thread

filterwarnings = 
    ignore::botorch.exceptions.warnings.NumericsWarning
    ignore::botorch.exceptions.warnings.BadInitialCandidatesWarning
    ignore::botorch.exceptions.warnings.InputDataWarning
    ignore::botorch.exceptions.warnings.OptimizationWarning
    ignore::linear_operator.utils.warnings.NumericalWarning
    ignore::gpytorch.utils.warnings.GPInputWarning
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::FutureWarning
